spring.application.name=poc JOP back


#Information sur la BDD
# spring.datasource.url=jdbc:mysql://localhost:3306/infolympicsdb
spring.datasource.url=jdbc:postgresql://localhost:5432/infolympicsdb?useUnicode=true&characterEncoding=UTF-8

spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.encoding=UTF-8

#logging.level.org.springframework.jdbc=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.net.ttddyy.dsproxy.listener=debug



#Username and password
spring.datasource.username=${DATABASE_USERNAME}
#infolympics
spring.datasource.password=${DATABASE_PASSWORD}
#Ultr4Dev@D2D

#Oubliez pas de donner les droits superutilisateurs à l'utilisateur infolympics sur postgresql ==> "ALTER USER infolympics WITH SUPERUSER;"

#Hibernate settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Regle le fuseau horaire sur GMT+2
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris

spring.jpa.hibernate.ddl-auto= create-drop
# spring.jpa.hibernate.ddl-auto= update
springdoc.swagger-ui.display-request-duration=true

